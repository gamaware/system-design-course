# Lab 12 - nginx as a reverse proxy in front of two services.
# This file replaces /etc/nginx/conf.d/default.conf, so everything here
# lives inside the http {} block of the stock nginx.conf.

# Do not advertise the nginx version in the Server header or error pages.
server_tokens off;

# ---------------------------------------------------------------------------
# Upstreams: the services the proxy speaks for. Clients never see these names.
# ---------------------------------------------------------------------------
upstream users_service {
    server users-service:5000;
}

upstream orders_service {
    server orders-service:5000;
}

# ---------------------------------------------------------------------------
# Access log: one line per request with the fields the lab inspects.
# ---------------------------------------------------------------------------
log_format lab12 '$remote_addr "$request" status=$status '
                 'cache=$upstream_cache_status client_key=$api_client '
                 'upstream=$upstream_addr rt=$request_time '
                 'xff="$http_x_forwarded_for"';

# ---------------------------------------------------------------------------
# Task 4: response cache stored on the proxy's disk.
# ---------------------------------------------------------------------------
proxy_cache_path /var/cache/nginx/lab12 levels=1:2 keys_zone=lab12_cache:10m
                 max_size=50m inactive=10m use_temp_path=off;

# ---------------------------------------------------------------------------
# Task 5: API keys and per-client rate limiting (gateway policies).
# A demo key maps to a client name. Unknown or missing keys map to "".
# ---------------------------------------------------------------------------
map $http_x_api_key $api_client {
    default        "";
    "team-alpha"   alpha;
    "team-beta"    beta;
}

# One bucket per client name, refilled at 2 requests per second.
# Requests with an empty key are not counted here (they get a 401 anyway).
limit_req_zone $api_client zone=per_client:10m rate=2r/s;
limit_req_status 429;
limit_req_log_level warn;

# ---------------------------------------------------------------------------
# Plain HTTP listener: only redirects to HTTPS (and answers the health check).
# ---------------------------------------------------------------------------
server {
    listen 8088;
    server_name localhost shop.example.test;
    access_log /var/log/nginx/access.log lab12;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS listener: TLS terminates here. Traffic to the services is plain HTTP.
# ---------------------------------------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost shop.example.test;
    access_log /var/log/nginx/access.log lab12;

    ssl_certificate     /etc/nginx/certs/proxy.crt;
    ssl_certificate_key /etc/nginx/certs/proxy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;

    # Headers every proxied request carries to the service (Task 6).
    # These are inherited by every location below that does not set its own.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Strip a header that would reveal the backend technology.
    proxy_hide_header X-Powered-By;

    default_type application/json;

    # Task 2: path-based routing to two services.
    location /users/ {
        proxy_pass http://users_service/;
    }

    # Task 4: cache only the expensive report.
    location = /users/report {
        proxy_pass http://users_service/report;
        proxy_cache lab12_cache;
        proxy_cache_valid 200 20s;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Task 5: the orders API requires a key and is rate limited per key.
    location /orders/ {
        if ($api_client = "") {
            return 401 '{"error": "missing or invalid X-API-Key"}\n';
        }
        limit_req zone=per_client burst=3 nodelay;
        proxy_pass http://orders_service/;
    }

    # Task 6: a naive rule that forwards nothing about the original client.
    # Setting any proxy_set_header here disables the server-level ones above
    # (Host falls back to $proxy_host); the empty values drop client-sent copies.
    location /legacy/users/ {
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_pass http://users_service/;
    }

    # A JSON answer for rejected requests, with a hint on when to retry.
    error_page 429 @rate_limited;
    location @rate_limited {
        add_header Retry-After 1 always;
        return 429 '{"error": "rate limit exceeded, slow down"}\n';
    }

    location / {
        return 404 '{"error": "no route for this path"}\n';
    }
}
