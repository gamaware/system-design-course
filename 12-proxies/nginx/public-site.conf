# Lab 12 - two "internet" websites that the corporate workstation wants to reach.
# They live on the lab12-internet network only; the workstation cannot route there.

server_tokens off;

# Log who connected (the TCP peer) and what the forward proxy added.
log_format site '$remote_addr host=$host "$request" status=$status '
                'xff="$http_x_forwarded_for" via="$http_via"';

server {
    listen 80;
    listen 443 ssl;
    server_name news.example.test;
    access_log /var/log/nginx/access.log site;

    ssl_certificate     /etc/nginx/certs/public-site.crt;
    ssl_certificate_key /etc/nginx/certs/public-site.key;

    default_type text/plain;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Cacheable for 60 seconds, so a caching forward proxy can reuse it.
    location / {
        expires 60s;
        return 200 "news.example.test: today's headlines (served to $remote_addr)\n";
    }
}

server {
    listen 80;
    server_name games.example.test;
    access_log /var/log/nginx/access.log site;
    default_type text/plain;

    location / {
        return 200 "games.example.test: you should not be here during work hours\n";
    }
}
