name: lab12-proxies

services:
  # --- Reverse proxy side (Tasks 1-6) ---------------------------------------
  users-service:
    build: ./backend
    container_name: lab12-users
    environment:
      - SERVICE_NAME=users-service
    # No "ports:" on purpose: the services are reachable only through the proxy.
    networks:
      - backend

  orders-service:
    build: ./backend
    container_name: lab12-orders
    environment:
      - SERVICE_NAME=orders-service
    networks:
      - backend

  reverse-proxy:
    image: nginx:1.30.6-alpine
    container_name: lab12-proxy
    depends_on:
      users-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    # Published on 127.0.0.1 only, like every port of this lab: other machines on the network cannot reach it.
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/proxy.crt:/etc/nginx/certs/proxy.crt:ro
      - ./certs/proxy.key:/etc/nginx/certs/proxy.key:ro
    networks:
      backend:
      internet:
        aliases:
          - shop.example.test
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shares the proxy's network namespace, so it sees exactly the packets the
  # proxy sends and receives: TLS from clients, plain HTTP to the services.
  sniffer:
    image: nicolaka/netshoot:v0.16
    container_name: lab12-sniffer
    network_mode: "service:reverse-proxy"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["sleep", "infinity"]
    depends_on:
      reverse-proxy:
        condition: service_healthy

  # --- Forward proxy side (Tasks 7-8) ---------------------------------------
  forward-proxy:
    # The tag names the Squid release of the original 24.04 image; Ubuntu ships
    # security updates under the same tag, so the digest pins the exact build
    # (Squid 6.13 on Ubuntu 24.04.3).
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: lab12-forward-proxy
    # 127.0.0.1 only: a proxy reachable from the network would let anyone relay traffic through it.
    ports:
      - "127.0.0.1:18128:3128"
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - corp
      - internet
    healthcheck:
      # Signals the running Squid; unlike a TCP probe it leaves no access-log noise.
      test: ["CMD", "squid", "-k", "check"]
      interval: 5s
      timeout: 3s
      retries: 10

  public-site:
    image: nginx:1.30.6-alpine
    container_name: lab12-public-site
    volumes:
      - ./nginx/public-site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/public-site.crt:/etc/nginx/certs/public-site.crt:ro
      - ./certs/public-site.key:/etc/nginx/certs/public-site.key:ro
    networks:
      internet:
        aliases:
          - news.example.test
          - games.example.test
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Host: news.example.test", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # An employee laptop on the corporate network. Its only way out is Squid.
  workstation:
    image: nicolaka/netshoot:v0.16
    container_name: lab12-workstation
    command: ["sleep", "infinity"]
    volumes:
      - ./certs/proxy.crt:/certs/proxy.crt:ro
      - ./certs/public-site.crt:/certs/public-site.crt:ro
    networks:
      - corp

networks:
  # internal: true means no route to the host or to other networks.
  backend:
    name: lab12-backend
    internal: true
  corp:
    name: lab12-corp
    internal: true
  internet:
    name: lab12-internet
