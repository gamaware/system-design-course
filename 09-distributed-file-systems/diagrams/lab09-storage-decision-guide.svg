<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <title>Lab 09 - Storage Model Decision Guide</title>
  <desc>Decision tree: what type of access does your app need? Random read/write (edit in place): need POSIX semantics? Yes leads to NFS, No means consider either. Sequential read/write (upload once, read many): need massive scale and HTTP? Yes leads to Object Storage (MinIO/S3), No leads to Block Storage (EBS/iSCSI).</desc>
  <style>
    text { font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; }
    .q { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .r { font-size: 20px; font-weight: 700; fill: #232F3E; }
    .rsub { font-size: 16px; fill: #545b64; }
    .branch { font-size: 17px; font-weight: 700; fill: #232F3E; }
    .branchsub { font-size: 15px; fill: #545b64; }
    .yn { font-size: 16px; font-weight: 700; fill: #232F3E; }
    .legend { font-size: 15px; fill: #545b64; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 12 4.5, 0 9" fill="#545b64"/>
    </marker>
  </defs>

  <rect id="canvas" width="1400" height="780" fill="#ffffff"/>

  <!-- Header, same layout as the other Lab 09 diagrams -->
  <text id="title" x="24" y="46" font-size="32" font-weight="700" fill="#000000">Lab 09 - Storage Model Decision Guide</text>
  <text id="subtitle" x="28" y="80" font-size="18" fill="#000000">Pick the storage model from how the app accesses its data, then from the semantics or scale it needs</text>
  <line id="rule" x1="24" y1="100" x2="1376" y2="100" stroke="#FF9900" stroke-width="2"/>

  <!-- Edges (drawn first so labels and nodes sit on top) -->
  <g id="edges" fill="none" stroke="#545b64" stroke-width="2" stroke-linejoin="round">
    <path id="e-root-random" d="M700 230 V290 H350 V384" marker-end="url(#arrow)"/>
    <path id="e-root-sequential" d="M700 230 V290 H1050 V384" marker-end="url(#arrow)"/>
    <path id="e-random-yes" d="M350 470 V520 H200 V614" marker-end="url(#arrow)"/>
    <path id="e-random-no" d="M350 470 V520 H500 V614" marker-end="url(#arrow)"/>
    <path id="e-sequential-yes" d="M1050 470 V520 H900 V614" marker-end="url(#arrow)"/>
    <path id="e-sequential-no" d="M1050 470 V520 H1200 V614" marker-end="url(#arrow)"/>
  </g>

  <!-- Edge labels with canvas-colored backgrounds -->
  <g id="edge-labels">
    <rect x="235" y="304" width="230" height="58" fill="#ffffff"/>
    <text id="l-random" class="branch" text-anchor="middle" x="350" y="327">Random read/write</text>
    <text class="branchsub" text-anchor="middle" x="350" y="350">(edit in place)</text>
    <rect x="925" y="304" width="250" height="58" fill="#ffffff"/>
    <text id="l-sequential" class="branch" text-anchor="middle" x="1050" y="327">Sequential read/write</text>
    <text class="branchsub" text-anchor="middle" x="1050" y="350">(upload once, read many)</text>

    <rect x="176" y="553" width="48" height="28" fill="#ffffff"/>
    <text id="l-random-yes" class="yn" text-anchor="middle" x="200" y="573">Yes</text>
    <rect x="478" y="553" width="44" height="28" fill="#ffffff"/>
    <text id="l-random-no" class="yn" text-anchor="middle" x="500" y="573">No</text>
    <rect x="876" y="553" width="48" height="28" fill="#ffffff"/>
    <text id="l-sequential-yes" class="yn" text-anchor="middle" x="900" y="573">Yes</text>
    <rect x="1178" y="553" width="44" height="28" fill="#ffffff"/>
    <text id="l-sequential-no" class="yn" text-anchor="middle" x="1200" y="573">No</text>
  </g>

  <!-- Question nodes: solid blue -->
  <g id="questions">
    <rect id="q-root" x="520" y="140" width="360" height="90" rx="12" fill="#007cbd" stroke="#005a8c" stroke-width="2"/>
    <text class="q" text-anchor="middle" x="700" y="180">What type of access</text>
    <text class="q" text-anchor="middle" x="700" y="206">does your app need?</text>

    <rect id="q-random" x="180" y="386" width="340" height="84" rx="12" fill="#007cbd" stroke="#005a8c" stroke-width="2"/>
    <text class="q" text-anchor="middle" x="350" y="423">Need POSIX</text>
    <text class="q" text-anchor="middle" x="350" y="449">semantics?</text>

    <rect id="q-sequential" x="880" y="386" width="340" height="84" rx="12" fill="#007cbd" stroke="#005a8c" stroke-width="2"/>
    <text class="q" text-anchor="middle" x="1050" y="423">Need massive scale</text>
    <text class="q" text-anchor="middle" x="1050" y="449">and HTTP access?</text>
  </g>

  <!-- Result nodes: light orange with orange border -->
  <g id="results">
    <rect id="r-nfs" x="85" y="616" width="230" height="70" rx="12" fill="#FFF5EB" stroke="#FF9900" stroke-width="2.5"/>
    <text class="r" text-anchor="middle" x="200" y="658">NFS</text>

    <rect id="r-either" x="385" y="616" width="230" height="70" rx="12" fill="#FFF5EB" stroke="#FF9900" stroke-width="2.5"/>
    <text class="r" text-anchor="middle" x="500" y="658">Consider either</text>

    <rect id="r-object" x="785" y="616" width="230" height="70" rx="12" fill="#FFF5EB" stroke="#FF9900" stroke-width="2.5"/>
    <text class="r" text-anchor="middle" x="900" y="646">Object Storage</text>
    <text class="rsub" text-anchor="middle" x="900" y="672">(MinIO / S3)</text>

    <rect id="r-block" x="1085" y="616" width="230" height="70" rx="12" fill="#FFF5EB" stroke="#FF9900" stroke-width="2.5"/>
    <text class="r" text-anchor="middle" x="1200" y="646">Block Storage</text>
    <text class="rsub" text-anchor="middle" x="1200" y="672">(EBS / iSCSI)</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="24" y="728" width="28" height="20" rx="5" fill="#007cbd" stroke="#005a8c" stroke-width="1.5"/>
    <text class="legend" x="62" y="743">Question</text>
    <rect x="160" y="728" width="28" height="20" rx="5" fill="#FFF5EB" stroke="#FF9900" stroke-width="2"/>
    <text class="legend" x="198" y="743">Recommended storage</text>
  </g>
</svg>
