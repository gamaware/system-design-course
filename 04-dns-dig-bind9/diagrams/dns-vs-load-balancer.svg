<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <style>text { font-family: "Courier New", "Lucida Console", monospace; }</style>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.5"/></pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#00b4d8"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#06d6a0"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#f77f00"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#0a1628"/>
  <rect width="1200" height="800" fill="url(#grid)" opacity="0.6"/>
  <text x="30" y="38" font-size="18" font-weight="700" fill="#ffffff">DNS vs. load balancer: when to use each?</text>
  <text x="630" y="14" font-size="12" fill="#00b4d8" letter-spacing="0.05em">LEGEND</text>
  <line x1="630" y1="26" x2="656" y2="26" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="662" y="30" font-size="12" fill="#90e0ef">request / query</text>
  <line x1="800" y1="26" x2="826" y2="26" stroke="#06d6a0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="832" y="30" font-size="12" fill="#90e0ef">DNS response (IP+TTL)</text>
  <line x1="630" y1="44" x2="656" y2="44" stroke="#f77f00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="662" y="48" font-size="12" fill="#90e0ef">removed by health check</text>
  <circle cx="913" cy="44" r="4" fill="#06d6a0"/>
  <text x="932" y="48" font-size="12" fill="#90e0ef">healthy</text>
  <circle cx="1003" cy="44" r="4" fill="#f77f00"/>
  <text x="1022" y="48" font-size="12" fill="#90e0ef">out</text>
  <rect x="30" y="58" width="555" height="264" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1" opacity="0.55"/>
  <text x="45" y="82" font-size="14" font-weight="700" fill="#00b4d8" letter-spacing="0.05em">DNS (Route 53, BIND9)</text>
  <line x1="30" y1="92" x2="585" y2="92" stroke="#00b4d8" stroke-width="0.6"/>
  <line x1="45" y1="180" x2="570" y2="180" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <rect x="50" y="108" width="100" height="44" rx="2" ry="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="100.0" y="127.0" text-anchor="middle" font-size="13" font-weight="700" fill="#caf0f8">User</text>
  <text x="100.0" y="143.0" text-anchor="middle" font-size="12" fill="#90e0ef">browser</text>
  <rect x="230" y="108" width="120" height="44" rx="2" ry="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="290.0" y="127.0" text-anchor="middle" font-size="13" font-weight="700" fill="#caf0f8">Resolver</text>
  <text x="290.0" y="143.0" text-anchor="middle" font-size="12" fill="#90e0ef">TTL cache</text>
  <rect x="430" y="108" width="130" height="44" rx="2" ry="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="495.0" y="127.0" text-anchor="middle" font-size="13" font-weight="700" fill="#caf0f8">Authoritative</text>
  <text x="495.0" y="143.0" text-anchor="middle" font-size="12" fill="#90e0ef">BIND9 / Route 53</text>
  <polyline points="150,122 230,122" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <polyline points="350,122 430,122" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <polyline points="430,140 350,140" fill="none" stroke="#06d6a0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <polyline points="230,140 150,140" fill="none" stroke="#06d6a0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="171.6" y="104" width="36.8" height="16" fill="#0d1f3c" opacity="0.95"/>
  <text x="190" y="116" text-anchor="middle" font-size="12" fill="#48cae4">name</text>
  <rect x="357.2" y="143" width="65.6" height="16" fill="#0d1f3c" opacity="0.95"/>
  <text x="390" y="155" text-anchor="middle" font-size="12" fill="#06d6a0">IP + TTL</text>
  <text x="48" y="198" font-size="12" fill="#caf0f8">• Translates name → IP</text>
  <text x="48" y="219" font-size="12" fill="#caf0f8">• Decides ONCE and the client caches the answer (TTL)</text>
  <text x="48" y="240" font-size="12" fill="#caf0f8">• DNS round robin: several IPs, blind to load</text>
  <text x="48" y="261" font-size="12" fill="#caf0f8">• Route 53: latency, geolocation, weighted, failover with</text>
  <text x="48" y="282" font-size="12" fill="#caf0f8">  health checks (slow, bound by TTL)</text>
  <text x="48" y="303" font-size="12" fill="#caf0f8">• Scope: global / across regions</text>
  <rect x="615" y="58" width="555" height="264" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1" opacity="0.55"/>
  <text x="630" y="82" font-size="14" font-weight="700" fill="#00b4d8" letter-spacing="0.05em">Load balancer (HAProxy, ALB, NLB)</text>
  <line x1="615" y1="92" x2="1170" y2="92" stroke="#00b4d8" stroke-width="0.6"/>
  <line x1="630" y1="180" x2="1155" y2="180" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <rect x="635" y="108" width="90" height="44" rx="2" ry="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="680.0" y="135.0" text-anchor="middle" font-size="13" font-weight="700" fill="#caf0f8">Client</text>
  <rect x="800" y="116" width="130" height="44" rx="2" ry="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="865.0" y="135.0" text-anchor="middle" font-size="13" font-weight="700" fill="#caf0f8">Load balancer</text>
  <text x="865.0" y="151.0" text-anchor="middle" font-size="12" fill="#90e0ef">HAProxy / ALB</text>
  <polyline points="725,138 800,138" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <rect x="732.8" y="119" width="58.4" height="16" fill="#0d1f3c" opacity="0.95"/>
  <text x="762" y="131" text-anchor="middle" font-size="12" fill="#48cae4">request</text>
  <polyline points="930,138 970,138" fill="none" stroke="#00b4d8" stroke-width="1.5"/>
  <polyline points="970,138 970,114 1010,114" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <polyline points="970,138 1010,138" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <polyline points="970,138 970,162 1010,162" fill="none" stroke="#f77f00" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <rect x="1010" y="104" width="130" height="20" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="1022" y="118" font-size="12" fill="#caf0f8">Backend 1</text>
  <circle cx="1124" cy="114" r="4" fill="#06d6a0"/>
  <rect x="1010" y="128" width="130" height="20" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="1022" y="142" font-size="12" fill="#caf0f8">Backend 2</text>
  <circle cx="1124" cy="138" r="4" fill="#06d6a0"/>
  <rect x="1010" y="152" width="130" height="20" rx="2" fill="#0d1f3c" stroke="#f77f00" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="1022" y="166" font-size="12" fill="#caf0f8">Backend 3</text>
  <circle cx="1124" cy="162" r="4" fill="#f77f00"/>
  <text x="633" y="198" font-size="12" fill="#caf0f8">• Receives each connection or request and picks a backend</text>
  <text x="633" y="219" font-size="12" fill="#caf0f8">• Layer 4 (IP/port) or layer 7 (URL, headers, cookies)</text>
  <text x="633" y="240" font-size="12" fill="#caf0f8">• Health checks in seconds: removes and re-adds nodes</text>
  <text x="633" y="261" font-size="12" fill="#caf0f8">• Sees real load: least connections, weighted, persistence</text>
  <text x="633" y="282" font-size="12" fill="#caf0f8">• Scope: one region / VPC; needs redundancy</text>
  <text x="633" y="303" font-size="12" fill="#caf0f8">  (the load balancer is a SPOF)</text>
  <rect x="30" y="340" width="1140" height="50" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="42" y="371" font-size="14" font-weight="700" fill="#00b4d8" letter-spacing="0.05em">DIMENSION</text>
  <text x="302" y="371" font-size="14" font-weight="700" fill="#00b4d8" letter-spacing="0.05em">DNS</text>
  <text x="742" y="371" font-size="14" font-weight="700" fill="#00b4d8" letter-spacing="0.05em">LOAD BALANCER</text>
  <rect x="30" y="390" width="1140" height="40" fill="#0d1f3c" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
  <text x="42" y="415" font-size="13" font-weight="700" fill="#48cae4">What it decides</text>
  <text x="302" y="415" font-size="13" fill="#caf0f8">name → IP</text>
  <text x="742" y="415" font-size="13" fill="#caf0f8">which backend gets each request</text>
  <rect x="30" y="430" width="1140" height="40" fill="#0a1628" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
  <text x="42" y="455" font-size="13" font-weight="700" fill="#48cae4">Granularity</text>
  <text x="302" y="455" font-size="13" fill="#caf0f8">per client / resolver</text>
  <text x="742" y="455" font-size="13" fill="#caf0f8">per connection or request</text>
  <rect x="30" y="470" width="1140" height="40" fill="#0d1f3c" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
  <text x="42" y="495" font-size="13" font-weight="700" fill="#48cae4">Reaction speed</text>
  <text x="302" y="495" font-size="13" fill="#caf0f8">minutes (TTL)</text>
  <text x="742" y="495" font-size="13" fill="#caf0f8">seconds</text>
  <rect x="30" y="510" width="1140" height="40" fill="#0a1628" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
  <text x="42" y="535" font-size="13" font-weight="700" fill="#48cae4">Health checks</text>
  <text x="302" y="535" font-size="13" fill="#caf0f8">optional, external</text>
  <text x="742" y="535" font-size="13" fill="#caf0f8">built-in, continuous</text>
  <rect x="30" y="550" width="1140" height="40" fill="#0d1f3c" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
  <text x="42" y="575" font-size="13" font-weight="700" fill="#48cae4">Sees real load</text>
  <text x="302" y="575" font-size="13" fill="#caf0f8">no</text>
  <text x="742" y="575" font-size="13" fill="#caf0f8">yes</text>
  <rect x="30" y="590" width="1140" height="40" fill="#0a1628" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
  <text x="42" y="615" font-size="13" font-weight="700" fill="#48cae4">Session persistence</text>
  <text x="302" y="615" font-size="13" fill="#caf0f8">not reliable</text>
  <text x="742" y="615" font-size="13" fill="#caf0f8">yes: cookie, source hash</text>
  <rect x="30" y="630" width="1140" height="40" fill="#0d1f3c" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
  <text x="42" y="655" font-size="13" font-weight="700" fill="#48cae4">Scope</text>
  <text x="302" y="655" font-size="13" fill="#caf0f8">global, multi-region</text>
  <text x="742" y="655" font-size="13" fill="#caf0f8">regional, one VPC</text>
  <rect x="30" y="670" width="1140" height="40" fill="#0a1628" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
  <text x="42" y="695" font-size="13" font-weight="700" fill="#48cae4">Example</text>
  <text x="302" y="695" font-size="13" fill="#caf0f8">www.shop.com → 3 IPs</text>
  <text x="742" y="695" font-size="13" fill="#caf0f8">ALB spreads across 20 instances</text>
  <line x1="290" y1="340" x2="290" y2="710" stroke="#00b4d8" stroke-width="0.6"/>
  <line x1="730" y1="340" x2="730" y2="710" stroke="#00b4d8" stroke-width="0.6"/>
  <text x="600" y="750" text-anchor="middle" font-size="14" fill="#caf0f8"><tspan font-weight="700" fill="#00b4d8">One does not replace the other:</tspan> DNS picks the region, the load balancer picks the server → see diagram 03 · The real pattern (multi-region)</text>
</svg>
