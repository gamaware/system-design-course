  <text x="956" y="486" font-size="10.5" fill="#1e40af" text-anchor="start" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">max_capacity=10</text>
  <text x="956" y="502" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >piso y techo (95–96)</text>
