  <rect x="700" y="590" width="460" height="82" rx="6" ry="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
  <text x="712" y="612" font-size="11.5" fill="#9a3412" text-anchor="start" font-weight="700" >⚠ Techo = max_capacity</text>
  <text x="712" y="632" font-size="11" fill="#9a3412" text-anchor="start" font-weight="400" >Con 10 tareas al 100 % de CPU ya no crece: la alarma sigue activa</text>
  <text x="712" y="648" font-size="11" fill="#9a3412" text-anchor="start" font-weight="400" >pero desired no pasa de 10.</text>
  <text x="712" y="664" font-size="11" fill="#9a3412" text-anchor="start" font-weight="400" >Solución: sube max_capacity o usa tareas más grandes (cpu=512).</text>
