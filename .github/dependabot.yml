version: 2
# cooldown: wait 7 days before proposing a new release, so a compromised or broken
# release is usually caught and yanked before it lands here (security updates are not delayed).
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  # Terraform providers
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Python (CDK apps) — lab 01
  - package-ecosystem: "pip"
    directories:
      - "/01-introduction-horizontal-scalability"
      - "/01-introduction-horizontal-scalability/ecsdemo-platform/cdk"
      - "/01-introduction-horizontal-scalability/ecsdemo-frontend/cdk"
      - "/01-introduction-horizontal-scalability/ecsdemo-nodejs/cdk"
      - "/01-introduction-horizontal-scalability/ecsdemo-crystal/cdk"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      aws-cdk:
        patterns: ["aws-cdk-lib", "constructs"]

  # Node demo app — lab 01
  - package-ecosystem: "npm"
    directory: "/01-introduction-horizontal-scalability/ecsdemo-nodejs"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Ruby demo app — lab 01 (Rails 8.1; PRs need manual review)
  - package-ecosystem: "bundler"
    directory: "/01-introduction-horizontal-scalability/ecsdemo-frontend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
