name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
          config: '.markdownlint.yaml'

  link-checker:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check links in markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.markdown-link-check.json'
        continue-on-error: true

  shell-check:
    name: Shell Script Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning

  yaml-lint:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: '.'
          config_file: '.yamllint.yml'
          strict: false

  dockerfile-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install hadolint
        run: |
          curl -sL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          chmod +x hadolint

      - name: Run hadolint (excluding third-party Dockerfiles)
        run: |
          find . -name 'Dockerfile*' ! -path '*/ecsdemo-*' \
            -exec ./hadolint --ignore DL3008 {} +

  file-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required files
        run: |
          echo "Checking repository structure..."

          if [ ! -f "LICENSE" ]; then
            echo "LICENSE file missing"
            exit 1
          fi
          echo "LICENSE found"

          if [ ! -f "README.md" ]; then
            echo "README.md missing"
            exit 1
          fi
          echo "README.md found"

          if [ ! -f ".gitignore" ]; then
            echo ".gitignore missing"
            exit 1
          fi
          echo ".gitignore found"

          for dir in */; do
            if [[ "$dir" == .* ]] || [[ "$dir" == "node_modules/" ]]; then
              continue
            fi

            if [ ! -f "${dir}README.md" ]; then
              echo "WARNING: ${dir} missing README.md"
            else
              echo "${dir}README.md found"
            fi
          done

          echo "Repository structure validation complete"

  readme-quality:
    name: README Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check README content
        run: |
          if ! grep -q "## " README.md; then
            echo "WARNING: README.md should have sections (##)"
          fi

          if ! grep -q "!\[" README.md; then
            echo "WARNING: README.md should have badges"
          fi

          if ! grep -q -i "author\|created by" README.md; then
            echo "WARNING: README.md should have author information"
          fi

          if ! grep -q -i "license" README.md; then
            echo "WARNING: README.md should mention license"
          fi

          echo "README quality check complete"

  actions-security:
    name: Actions Security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          ZIZMOR_VERSION="1.23.1"
          ZIZMOR_BASE="https://github.com/woodruffw/zizmor/releases"
          ZIZMOR_TAR="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sL "${ZIZMOR_BASE}/download/v${ZIZMOR_VERSION}/${ZIZMOR_TAR}" \
            -o /tmp/zizmor.tar.gz
          mkdir -p /tmp/zizmor-extract
          tar -xzf /tmp/zizmor.tar.gz -C /tmp/zizmor-extract
          find /tmp/zizmor-extract -name zizmor -type f -exec sudo mv {} /usr/local/bin/zizmor \;
          chmod +x /usr/local/bin/zizmor

      - name: Run zizmor
        run: zizmor --config zizmor.yml .github/workflows/

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install linters
        run: pip install ruff bandit

      - name: Run Ruff
        run: |
          ruff check --exclude '01-introduction-horizontal-scalability/ecsdemo-*' .

      - name: Run Bandit
        run: |
          bandit -r . -c pyproject.toml \
            --exclude '01-introduction-horizontal-scalability/ecsdemo-*'

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run ESLint
        run: |
          npx --yes eslint .

      - name: Run Prettier check
        run: |
          find . \( -name '*.js' -o -name '*.html' -o -name '*.css' \) \
            ! -path '*/ecsdemo-*' ! -path '*/node_modules/*' \
            -exec npx --yes prettier --check {} +

      - name: Run HTMLHint
        run: |
          find . -name '*.html' ! -path '*/ecsdemo-*' ! -path '*/node_modules/*' \
            -exec npx --yes htmlhint {} +

      - name: Run Stylelint
        run: |
          # stylelint resolves "extends" from the config directory, so point
          # config-basedir at the npx cache where the shared config is installed.
          stylelint_bin=$(npx --yes --package stylelint --package stylelint-config-standard -- \
            sh -c 'command -v stylelint')
          basedir=$(dirname "$(dirname "$stylelint_bin")")
          find . -name '*.css' ! -path '*/ecsdemo-*' ! -path '*/node_modules/*' \
            -exec "$stylelint_bin" --config-basedir "$basedir" {} +

  prose-lint:
    name: Prose Linting (Vale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Vale
        env:
          VALE_VERSION: "3.13.1"
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar xz -C /usr/local/bin vale

      - name: Sync Vale packages
        run: vale sync

      - name: Run Vale
        run: |
          find . -name '*.md' ! -path '*/ecsdemo-*' ! -path '*/node_modules/*' ! -path '*/styles/*' \
            -exec vale {} +
