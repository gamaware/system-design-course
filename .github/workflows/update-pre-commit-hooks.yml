name: Update Pre-commit Hooks

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-hooks:
    name: Update Pre-commit Hooks
    runs-on: ubuntu-latest
    # zizmor's secrets-outside-env audit requires secrets to be read inside a
    # job environment. "automation" carries no protection rules and GitHub
    # creates it on first use.
    environment: automation
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Update Hooks
        uses: ./.github/actions/update-pre-commit-composite
        with:
          github_token: ${{ secrets.PRE_COMMIT_PAT }}
