<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="24" y="38" font-size="18" fill="#111827" text-anchor="start" font-weight="700" >Module 2 · Compute — What is virtualization?</text>
  <text x="24" y="56" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >Based on “Virtualization Explained” (IBM Technology)</text>
  <text x="1176" y="38" font-size="12" fill="#6b7280" text-anchor="end" font-weight="400" >ITESO · Scalable Systems Design</text>
  <rect x="24" y="70" width="1152" height="52" rx="10" ry="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="40" y="92" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="700" >Virtualization</text>
  <text x="40" y="110" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400" >= creating a software-based (virtual) version of something: compute, storage, networks, servers or applications.</text>
  <rect x="922" y="88" width="238" height="16" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="1041.0" y="99.5" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="600" >‘old’ technology, but the core of the cloud</text>
  <rect x="24" y="138" width="476" height="356" rx="10" ry="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" />
  <text x="44" y="162" font-size="14" fill="#111827" text-anchor="start" font-weight="700" >Before · Traditional on-prem</text>
  <text x="44" y="180" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >1 server = 1 OS = 1 application</text>
  <text x="113" y="208" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="600" >Server 1</text>
  <rect x="48" y="216" width="130" height="32" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="113" y="236" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" >App</text>
  <rect x="48" y="254" width="130" height="32" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="113" y="274" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" >OS</text>
  <rect x="48" y="292" width="130" height="40" rx="6" ry="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <text x="113" y="310" font-size="11" fill="#374151" text-anchor="middle" font-weight="700" >Hardware</text>
  <text x="113" y="324" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >physical server</text>
  <rect x="73" y="342" width="80" height="16" rx="8" ry="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" />
  <text x="113.0" y="353.5" font-size="9.5" fill="#4b5563" text-anchor="middle" font-weight="600" >usage ≈ 15 %</text>
  <text x="113" y="374" font-size="9.5" fill="#9ca3af" text-anchor="middle" font-weight="400" >underutilized</text>
  <text x="267" y="208" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="600" >Server 2</text>
  <rect x="202" y="216" width="130" height="32" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="267" y="236" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" >App</text>
  <rect x="202" y="254" width="130" height="32" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="267" y="274" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" >OS</text>
  <rect x="202" y="292" width="130" height="40" rx="6" ry="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <text x="267" y="310" font-size="11" fill="#374151" text-anchor="middle" font-weight="700" >Hardware</text>
  <text x="267" y="324" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >physical server</text>
  <rect x="227" y="342" width="80" height="16" rx="8" ry="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" />
  <text x="267.0" y="353.5" font-size="9.5" fill="#4b5563" text-anchor="middle" font-weight="600" >usage ≈ 15 %</text>
  <text x="267" y="374" font-size="9.5" fill="#9ca3af" text-anchor="middle" font-weight="400" >underutilized</text>
  <text x="421" y="208" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="600" >Server 3</text>
  <rect x="356" y="216" width="130" height="32" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="421" y="236" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" >App</text>
  <rect x="356" y="254" width="130" height="32" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="421" y="274" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" >OS</text>
  <rect x="356" y="292" width="130" height="40" rx="6" ry="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <text x="421" y="310" font-size="11" fill="#374151" text-anchor="middle" font-weight="700" >Hardware</text>
  <text x="421" y="324" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >physical server</text>
  <rect x="381" y="342" width="80" height="16" rx="8" ry="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" />
  <text x="421.0" y="353.5" font-size="9.5" fill="#4b5563" text-anchor="middle" font-weight="600" >usage ≈ 15 %</text>
  <text x="421" y="374" font-size="9.5" fill="#9ca3af" text-anchor="middle" font-weight="400" >underutilized</text>
  <rect x="48" y="400" width="438" height="72" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="60" y="424" font-size="11" fill="#374151" text-anchor="start" font-weight="600" >Each app needs its own server:</text>
  <text x="60" y="442" font-size="11" fill="#374151" text-anchor="start" font-weight="400" >more servers, more electricity, more maintenance.</text>
  <text x="60" y="460" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >Scaling = buying hardware (slow and expensive).</text>
  <polygon points="506,296 538,296 538,282 558,306 538,330 538,316 506,316" fill="#2563eb"/>
  <rect x="502" y="344" width="56" height="16" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="530" y="355.5" font-size="8.5" fill="#1e40af" text-anchor="middle" font-weight="600" >virtualize</text>
  <rect x="560" y="138" width="616" height="356" rx="10" ry="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" />
  <text x="580" y="162" font-size="14" fill="#111827" text-anchor="start" font-weight="700" >With virtualization</text>
  <text x="580" y="180" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >1 physical server, many VMs</text>
  <rect x="860" y="170" width="130" height="16" rx="8" ry="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1" />
  <text x="925.0" y="181.5" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="600" >independent of each other</text>
  <rect x="584" y="194" width="122" height="82" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="645" y="211" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700" >VM 1 · Windows</text>
  <rect x="594" y="220" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="645" y="235" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >Apps</text>
  <rect x="594" y="248" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="645" y="263" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >Own OS</text>
  <rect x="726" y="194" width="122" height="82" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="787" y="211" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700" >VM 2 · Linux</text>
  <rect x="736" y="220" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="787" y="235" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >Apps</text>
  <rect x="736" y="248" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="787" y="263" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >Own OS</text>
  <rect x="868" y="194" width="122" height="82" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="929" y="211" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700" >VM 3 · Unix</text>
  <rect x="878" y="220" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="929" y="235" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >Apps</text>
  <rect x="878" y="248" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="929" y="263" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >Own OS</text>
  <rect x="584" y="290" width="406" height="36" rx="6" ry="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
  <text x="787" y="305" font-size="11.5" fill="#1e40af" text-anchor="middle" font-weight="700" >Hypervisor</text>
  <text x="787" y="320" font-size="9.5" fill="#1e40af" text-anchor="middle" font-weight="400" >pools the host's resources and assigns them to each VM</text>
  <rect x="584" y="340" width="406" height="40" rx="6" ry="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <text x="600" y="358" font-size="11" fill="#374151" text-anchor="start" font-weight="700" >Hardware</text>
  <text x="600" y="373" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" >physical server (host A) · CPU · RAM · network · storage</text>
  <rect x="890" y="352" width="84" height="16" rx="8" ry="8" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="932.0" y="363.5" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="600" >usage ≈ 80 %</text>
  <rect x="1006" y="400" width="160" height="74" rx="8" ry="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" />
  <text x="1086" y="421" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700" >Host B · Hypervisor</text>
  <text x="1086" y="440" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >another physical machine</text>
  <text x="1086" y="460" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="600" >if host A fails → less downtime</text>
  <path d="M 990,233 C 1120,233 1150,310 1130,398" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#ap)"/>
  <rect x="1002" y="282" width="112" height="44" rx="3" ry="3" fill="#ffffff" stroke="#ffffff" stroke-width="0" opacity="0.95"/>
  <text x="1058" y="296" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="700" >portability</text>
  <text x="1058" y="309" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="600" >move a VM to another host</text>
  <text x="1058" y="322" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="600" >almost instantly</text>
  <text x="600" y="480" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >Multitenancy: several isolated VMs share the same hardware.</text>
  <text x="24" y="526" font-size="12" fill="#111827" text-anchor="start" font-weight="700" >Benefits (per the video)</text>
  <rect x="24" y="536" width="236" height="88" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="38" y="562" font-size="16" fill="#111827" text-anchor="start" font-weight="400" >💰</text>
  <text x="64" y="561" font-size="12" fill="#15803d" text-anchor="start" font-weight="700" >Cost savings</text>
  <text x="38" y="588" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >server consolidation:</text>
  <text x="38" y="604" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >less hardware, power and maintenance</text>
  <rect x="276" y="536" width="236" height="88" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="290" y="562" font-size="16" fill="#111827" text-anchor="start" font-weight="400" >⚡</text>
  <text x="316" y="561" font-size="12" fill="#15803d" text-anchor="start" font-weight="700" >Agility</text>
  <text x="290" y="588" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >spin up a VM for dev/test</text>
  <text x="290" y="604" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >in minutes, not weeks</text>
  <rect x="528" y="536" width="236" height="88" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="542" y="562" font-size="16" fill="#111827" text-anchor="start" font-weight="400" >🛡️</text>
  <text x="568" y="561" font-size="12" fill="#15803d" text-anchor="start" font-weight="700" >Less downtime</text>
  <text x="542" y="588" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >migrate VMs to another host</text>
  <text x="542" y="604" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >if the host fails</text>
  <rect x="780" y="510" width="396" height="138" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="796" y="532" font-size="12" fill="#1e40af" text-anchor="start" font-weight="700" >In this course</text>
  <text x="796" y="552" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >An EC2 instance (or an Azure VM) is a VM running on the</text>
  <text x="796" y="569" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >provider's hypervisor.</text>
  <text x="796" y="586" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >AMI = VM image · instance type (t3.micro…) =</text>
  <text x="796" y="603" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >size (vCPU/RAM) · Lab 1: launch and connect to your 1st VM.</text>
  <text x="796" y="620" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="600" >Scalability and elasticity = create/destroy VMs on demand.</text>
  <line x1="24" y1="700" x2="52" y2="700" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="58" y="704" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >Layers / flow (hardware → hypervisor → VM)</text>
  <line x1="330" y1="700" x2="358" y2="700" stroke="#9333ea" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="364" y="704" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >VM migration / portability</text>
  <rect x="580" y="692" width="28" height="16" rx="8" ry="8" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="614" y="704" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >Benefit</text>
  <rect x="720" y="692" width="28" height="16" rx="8" ry="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" />
  <text x="754" y="704" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >Previous state (on-prem, underutilized)</text>
  <line x1="24" y1="676" x2="1176" y2="676" stroke="#e5e7eb" stroke-width="1"/>
</svg>