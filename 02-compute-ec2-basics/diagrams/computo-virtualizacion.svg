  <text x="58" y="704" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >Capas / flujo (hardware → hypervisor → VM)</text>
  <line x1="330" y1="700" x2="358" y2="700" stroke="#9333ea" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="364" y="704" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >Migración / portabilidad de VMs</text>
