  <text x="267" y="374" font-size="9.5" fill="#9ca3af" text-anchor="middle" font-weight="400" >subutilizado</text>
  <text x="421" y="208" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="600" >Servidor 3</text>
  <rect x="356" y="216" width="130" height="32" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="421" y="236" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" >App</text>
