  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="24" y="38" font-size="18" fill="#111827" text-anchor="start" font-weight="700" >Módulo 2 · Cómputo — ¿Qué es la virtualización?</text>
  <text x="24" y="56" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >Basado en “Virtualization Explained” (IBM Technology)</text>
  <text x="1176" y="38" font-size="12" fill="#6b7280" text-anchor="end" font-weight="400" >ITESO · Diseño de Sistemas Escalables</text>
  <rect x="24" y="70" width="1152" height="52" rx="10" ry="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="40" y="92" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="700" >Virtualización</text>
  <text x="40" y="110" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400" >= crear una versión basada en software (virtual) de algo: cómputo, almacenamiento, redes, servidores o aplicaciones.</text>
  <rect x="922" y="88" width="238" height="16" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="1041.0" y="99.5" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="600" >tecnología ‘vieja’ pero núcleo de la nube</text>
