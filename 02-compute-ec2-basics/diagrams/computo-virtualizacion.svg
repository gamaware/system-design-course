  <text x="421" y="274" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" >SO</text>
  <rect x="356" y="292" width="130" height="40" rx="6" ry="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <text x="421" y="310" font-size="11" fill="#374151" text-anchor="middle" font-weight="700" >Hardware</text>
  <text x="421" y="324" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >servidor físico</text>
  <rect x="381" y="342" width="80" height="16" rx="8" ry="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" />
  <text x="421.0" y="353.5" font-size="9.5" fill="#4b5563" text-anchor="middle" font-weight="600" >uso ≈ 15 %</text>
  <text x="421" y="374" font-size="9.5" fill="#9ca3af" text-anchor="middle" font-weight="400" >subutilizado</text>
  <rect x="48" y="400" width="438" height="72" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="60" y="424" font-size="11" fill="#374151" text-anchor="start" font-weight="600" >Cada app necesita su propio servidor:</text>
  <text x="60" y="442" font-size="11" fill="#374151" text-anchor="start" font-weight="400" >más servidores, más electricidad, más mantenimiento.</text>
  <text x="60" y="460" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >Escalar = comprar hardware (lento y caro).</text>
  <polygon points="506,296 538,296 538,282 558,306 538,330 538,316 506,316" fill="#2563eb"/>
  <rect x="502" y="344" width="56" height="16" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="530" y="355.5" font-size="8.5" fill="#1e40af" text-anchor="middle" font-weight="600" >virtualizar</text>
  <rect x="560" y="138" width="616" height="356" rx="10" ry="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" />
  <text x="580" y="162" font-size="14" fill="#111827" text-anchor="start" font-weight="700" >Con virtualización</text>
  <text x="580" y="180" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >1 servidor físico, muchas VMs</text>
  <rect x="860" y="170" width="130" height="16" rx="8" ry="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1" />
  <text x="925.0" y="181.5" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="600" >independientes entre sí</text>
  <rect x="584" y="194" width="122" height="82" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="645" y="211" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700" >VM 1 · Windows</text>
  <rect x="594" y="220" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="645" y="235" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >Apps</text>
  <rect x="594" y="248" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="645" y="263" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >SO propio</text>
  <rect x="726" y="194" width="122" height="82" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="787" y="211" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700" >VM 2 · Linux</text>
  <rect x="736" y="220" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="787" y="235" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >Apps</text>
  <rect x="736" y="248" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="787" y="263" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >SO propio</text>
  <rect x="868" y="194" width="122" height="82" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="929" y="211" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700" >VM 3 · Unix</text>
  <rect x="878" y="220" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="929" y="235" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >Apps</text>
  <rect x="878" y="248" width="102" height="22" rx="4" ry="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="929" y="263" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >SO propio</text>
  <rect x="584" y="290" width="406" height="36" rx="6" ry="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
  <text x="787" y="305" font-size="11.5" fill="#1e40af" text-anchor="middle" font-weight="700" >Hypervisor</text>
  <text x="787" y="320" font-size="9.5" fill="#1e40af" text-anchor="middle" font-weight="400" >agrupa (pool) los recursos del host y los asigna a cada VM</text>
  <rect x="584" y="340" width="406" height="40" rx="6" ry="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <text x="600" y="358" font-size="11" fill="#374151" text-anchor="start" font-weight="700" >Hardware</text>
  <text x="600" y="373" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" >servidor físico (host A) · CPU · RAM · red · storage</text>
  <rect x="890" y="352" width="84" height="16" rx="8" ry="8" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="932.0" y="363.5" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="600" >uso ≈ 80 %</text>
  <rect x="1006" y="400" width="160" height="74" rx="8" ry="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" />
  <text x="1086" y="421" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700" >Host B · Hypervisor</text>
  <text x="1086" y="440" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >otra máquina física</text>
  <text x="1086" y="460" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="600" >si host A cae → menor downtime</text>
  <path d="M 990,233 C 1120,233 1150,310 1130,398" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#ap)"/>
  <rect x="1002" y="282" width="112" height="44" rx="3" ry="3" fill="#ffffff" stroke="#ffffff" stroke-width="0" opacity="0.95"/>
  <text x="1058" y="296" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="700" >portabilidad</text>
  <text x="1058" y="309" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="600" >mover una VM a otro host</text>
  <text x="1058" y="322" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="600" >casi al instante</text>
  <text x="600" y="480" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >Multitenancy: varias VMs aisladas comparten un mismo hardware.</text>
  <text x="24" y="526" font-size="12" fill="#111827" text-anchor="start" font-weight="700" >Beneficios (según el video)</text>
  <rect x="24" y="536" width="236" height="88" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="38" y="562" font-size="16" fill="#111827" text-anchor="start" font-weight="400" >💰</text>
  <text x="64" y="561" font-size="12" fill="#15803d" text-anchor="start" font-weight="700" >Ahorro de costos</text>
  <text x="38" y="588" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >consolidación de servidores:</text>
  <text x="38" y="604" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >menos hardware, luz y mantenimiento</text>
  <rect x="276" y="536" width="236" height="88" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="290" y="562" font-size="16" fill="#111827" text-anchor="start" font-weight="400" >⚡</text>
  <text x="316" y="561" font-size="12" fill="#15803d" text-anchor="start" font-weight="700" >Agilidad</text>
  <text x="290" y="588" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >levantar una VM para dev/test</text>
  <text x="290" y="604" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >en minutos, no semanas</text>
  <rect x="528" y="536" width="236" height="88" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="542" y="562" font-size="16" fill="#111827" text-anchor="start" font-weight="400" >🛡️</text>
  <text x="568" y="561" font-size="12" fill="#15803d" text-anchor="start" font-weight="700" >Menor downtime</text>
  <text x="542" y="588" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >migrar VMs a otro host</text>
  <text x="542" y="604" font-size="10.5" fill="#374151" text-anchor="start" font-weight="400" >si el host falla</text>
  <rect x="780" y="510" width="396" height="138" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="796" y="532" font-size="12" fill="#1e40af" text-anchor="start" font-weight="700" >En este curso</text>
  <text x="796" y="552" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >Una instancia EC2 (o una Azure VM) es una VM sobre el</text>
  <text x="796" y="569" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >hypervisor del proveedor.</text>
  <text x="796" y="586" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >AMI = imagen de la VM · tipo de instancia (t3.micro…) =</text>
  <text x="796" y="603" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >tamaño (vCPU/RAM) · Lab 1: lanzas y te conectas a tu 1.ª VM.</text>
  <text x="796" y="620" font-size="10.5" fill="#1e3a8a" text-anchor="start" font-weight="600" >Escalabilidad y elasticidad = crear/destruir VMs bajo demanda.</text>
