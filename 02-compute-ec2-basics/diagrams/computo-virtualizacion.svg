  <text x="44" y="162" font-size="14" fill="#111827" text-anchor="start" font-weight="700" >Antes · On-Prem tradicional</text>
  <text x="44" y="180" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >1 servidor = 1 SO = 1 aplicación</text>
  <text x="113" y="208" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="600" >Servidor 1</text>
  <rect x="48" y="216" width="130" height="32" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="113" y="236" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" >App</text>
