  <text x="614" y="704" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >Beneficio</text>
  <rect x="720" y="692" width="28" height="16" rx="8" ry="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" />
