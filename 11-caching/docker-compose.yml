services:
  redis:
    # Pinned to 7.2: Redis 7.4 starts at ~1.04 MB when empty, which already exceeds the
    # 1 MB ceiling Task 6 sets, so every write returns OOM and nothing is ever evicted.
    # latency-tracking is off for the same reason: Redis 7 keeps a ~24 KB latency histogram
    # per command type it has run, so after Tasks 2-5 used memory is already above 1 MB.
    image: redis:7.2-alpine
    container_name: redis-cache
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 10mb --maxmemory-policy noeviction --latency-tracking no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: backend-db
    ports:
      - "127.0.0.1:5050:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  cpp:
    build: ./cpp
    container_name: cache-lab-cpp
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BACKEND_HOST=backend
    volumes:
      - ./cpp:/app/src
    profiles:
      - cpp

  csharp:
    build: ./csharp
    container_name: cache-lab-csharp
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BACKEND_HOST=backend
    volumes:
      - ./csharp:/app/src
    profiles:
      - csharp

  java:
    build: ./java
    container_name: cache-lab-java
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BACKEND_HOST=backend
    volumes:
      - ./java:/app/src
    profiles:
      - java

  python:
    build: ./python
    container_name: cache-lab-python
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BACKEND_HOST=backend
    volumes:
      - ./python:/app/src
    profiles:
      - python

  go:
    build: ./go
    container_name: cache-lab-go
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BACKEND_HOST=backend
    volumes:
      - ./go:/app/src
    profiles:
      - go
