global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option log-health-checks
    timeout connect 1s
    timeout client 10s
    # A request that takes longer than this is cut with HTTP 504: the client-side timeout of Task 3.
    timeout server 2s
    timeout check 1s
    # No retries and no redispatch: every failed request is visible to the client.
    retries 0

# Port 18080: the same three nodes WITH active health checks.
frontend fe_checks
    bind :18080
    default_backend be_checks

# Port 18081: the same three nodes WITHOUT health checks.
frontend fe_nochecks
    bind :18081
    default_backend be_nochecks

backend be_checks
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    # CHECK_INTER comes from docker-compose.yml (default 1s). A node is DOWN after 2 failed checks
    # in a row and back UP after 2 good ones.
    default-server inter "${CHECK_INTER}" fall 2 rise 2
    server node1 toxiproxy:18041 check
    server node2 toxiproxy:18042 check
    server node3 toxiproxy:18043 check

backend be_nochecks
    balance roundrobin
    server node1 toxiproxy:18041
    server node2 toxiproxy:18042
    server node3 toxiproxy:18043

listen stats
    bind :18090
    stats enable
    stats uri /stats
    stats refresh 2s
